version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: algonode
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"

  python-worker:
    build: ./worker-python
    ports:
      - "8000:8000"
    depends_on:
      - db

  go-api:
    build: ./api-go
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgres://admin:password@db:5432/algonode?sslmode=disable
      - PYTHON_WORKER_URL=http://python-worker:8000
    depends_on:
      - db
      - python-worker